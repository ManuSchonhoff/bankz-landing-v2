<title>Seguimiento de Venta Bankz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&display=swap">
<style>
/* Layout: encabezado con logo y acciones, pestañas por arista del plan, tablas editables en línea; monocromo Bankz. */
:root{
  --bg:#F9F9F9; --surface:#FFFFFF; --fg:#05090A; --muted:#595959; --line:#D9D9D9; --line-strong:#05090A;
  --ink-1:#05090A; --ink-2:#595959; --ink-3:#9A9A9A; --ink-4:#BFBFBF; --ink-5:#EFEFEF;
  --on-ink:#F9F9F9; --focus:#05090A;
  --font:'Alexandria',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#05090A; --surface:#0E1315; --fg:#F9F9F9; --muted:#A3ABAE; --line:#2A3134; --line-strong:#F9F9F9;
    --ink-1:#F9F9F9; --ink-2:#BFBFBF; --ink-3:#8C9497; --ink-4:#4A5255; --ink-5:#1A2124;
    --on-ink:#05090A; --focus:#F9F9F9; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#05090A; --surface:#0E1315; --fg:#F9F9F9; --muted:#A3ABAE; --line:#2A3134; --line-strong:#F9F9F9;
  --ink-1:#F9F9F9; --ink-2:#BFBFBF; --ink-3:#8C9497; --ink-4:#4A5255; --ink-5:#1A2124;
  --on-ink:#05090A; --focus:#F9F9F9; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
h2{font-size:26px;line-height:1.1}
h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{height:30px;width:auto;display:block}
.logo-w{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-d{display:none} :root:not([data-theme="light"]) .logo-w{display:block} }
:root[data-theme="dark"] .logo-d{display:none} :root[data-theme="dark"] .logo-w{display:block}
.brand .t{border-left:1px solid var(--line);padding-left:14px}
.brand .t b{display:block;font-size:14px;font-weight:700}
.brand .t span{display:block;font-size:12px;color:var(--muted)}
.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line-strong);background:transparent;padding:8px 14px;border-radius:2px;font-weight:700;font-size:13px;cursor:pointer;line-height:1}
.btn.solid{background:var(--ink-1);color:var(--on-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:5px 10px;font-size:12px}
.status{font-size:12px;color:var(--muted);min-width:0}
.status.err{color:var(--fg);font-weight:700}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:12px 12px 10px;font-weight:500;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--ink-1)}
nav.tabs button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
section.tab{display:none;padding-block:22px 10px}
section.tab.on{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{color:var(--muted);max-width:68ch}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border:1px solid var(--line);background:var(--surface);padding:14px 16px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:30px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.kpi.dark{background:var(--ink-1);color:var(--on-ink);border-color:var(--ink-1)}
.kpi.dark .l,.kpi.dark .s,.kpi.dark .v small{color:var(--on-ink);opacity:.72}
.meter{height:6px;background:var(--ink-5);margin-top:10px;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink-1)}
.kpi.dark .meter{background:rgba(128,128,128,.35)}
.kpi.dark .meter i{background:var(--on-ink)}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.card{border:1px solid var(--line);background:var(--surface);padding:16px;min-width:0}
.card h3{margin-bottom:12px}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{background:var(--ink-1);color:var(--on-ink);font-weight:700;font-size:11px;text-align:left;padding:7px 8px;letter-spacing:.03em;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:middle}
tr.group td{background:var(--ink-5);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px}
tr.total td{font-weight:700;border-top:2px solid var(--line-strong);border-bottom:0}
td.num,th.num{text-align:right}
td.c,th.c{text-align:center}
td.small{font-size:12px;color:var(--muted)}
.in{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 4px;width:100%;min-width:60px;border-radius:0}
.in:focus{outline:none;border-bottom:1.5px solid var(--focus)}
.in.num{width:58px;min-width:58px;text-align:right}
table.compact td,table.compact th{padding:5px 6px}
table.compact .in.num{width:46px;min-width:46px}
table.compact td:first-child,table.compact th:first-child{position:sticky;left:0;z-index:1;background:var(--bg)}
table.compact th:first-child{background:var(--ink-1)}
table.compact tr.total td:first-child{background:var(--bg)}
.in.money{width:110px;min-width:110px;text-align:right}
.in.short{width:120px;min-width:100px}
.in.wide{min-width:180px}
.in.date{width:132px;min-width:132px}
select.in{appearance:none;-webkit-appearance:none;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 9px) 55%,calc(100% - 5px) 55%;background-size:4px 4px;background-repeat:no-repeat;cursor:pointer;width:auto;min-width:118px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink-1);cursor:pointer;margin:0;vertical-align:middle}
input:disabled,select:disabled{opacity:.7;cursor:default}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border:1.5px solid var(--ink-1);border-radius:2px;white-space:nowrap;line-height:1.4}
.chip.fill{background:var(--ink-1);color:var(--on-ink)}
.chip.dash{border-style:dashed}
.chip.ghost{border-color:var(--ink-3);color:var(--muted)}
.late{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
tr.vencida td:first-child{box-shadow:inset 4px 0 0 var(--ink-1)}
tr.hecha td{color:var(--muted)}
tr.hecha td .in{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:6px 10px;font-size:12px;font-weight:500;cursor:pointer;border-radius:2px}
.filters button[aria-pressed="true"]{background:var(--ink-1);color:var(--on-ink);border-color:var(--ink-1);font-weight:700}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,1.1fr) 3fr auto;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:16px;background:var(--ink-5);position:relative;min-width:0}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-1)}
.bar .tr i.b{background:var(--ink-3)}
.bar b{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;vertical-align:-1px;margin-right:5px}
svg text{font-family:var(--font)}
.empty{border:1px dashed var(--line);padding:18px;color:var(--muted);font-size:13px;text-align:center}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.item .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:6ch}
.item .m{color:var(--muted);font-size:12px;display:block}
.foot{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot b{color:var(--fg);font-weight:700}
.base-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.base-form label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:block}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);margin-top:10px;max-width:80ch}
.rm{border:1px solid var(--line);background:transparent;font-size:11px;padding:3px 7px;cursor:pointer;color:var(--muted);border-radius:2px;white-space:nowrap}
.rm.arm{border-color:var(--ink-1);color:var(--fg);font-weight:700}
@media (max-width:600px){ h2{font-size:22px} .kpi .v{font-size:26px} .bar{grid-template-columns:minmax(90px,1fr) 2fr auto} }
@media (prefers-reduced-motion: no-preference){ .meter i,.bar .tr i{transition:width .4s ease} }
@media print{
  nav.tabs,.actions,.filters,.rm,.toolbar{display:none !important}
  section.tab{display:block !important;page-break-inside:avoid}
  body{background:#fff;color:#000}
}
</style>

const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);

/* ---------- derived data ---------- */
function weekRows(){
  const rows=[];const last=mondayOf(todayISO());
  for(let w=FIRST_WEEK;w<=last;w=addDays(w,7)) rows.push({lunes:w,label:'Sem. '+ddmm(w),plan:SEMANAS_PLAN[w]||'',doc:S.semanas[w]||null});
  Object.keys(S.semanas).filter(w=>w>last).sort().forEach(w=>rows.push({lunes:w,label:'Sem. '+ddmm(w),plan:SEMANAS_PLAN[w]||'',doc:S.semanas[w]}));
  return rows;
}
function cellVal(doc,k,m){const x=doc&&doc.v&&doc.v[k];return x&&x[m]!=null?Number(x[m]):null;}
function compute(){
  const base=Object.assign({},DEF_BASE,S.base||{});base.origenBase=Object.assign({},DEF_BASE.origenBase,(S.base&&S.base.origenBase)||{});
  const weeks=weekRows();const tot={};FRENTES.forEach(f=>tot[f.k]={c:0,v:0,k:0});
  let weeksWithData=0;
  weeks.forEach(w=>{let has=false;FRENTES.forEach(f=>['c','v','k'].forEach(m=>{const x=cellVal(w.doc,f.k,m);if(x!=null){tot[f.k][m]+=x;has=true;}}));w.has=has;if(has)weeksWithData++;});
  const sum=m=>FRENTES.reduce((a,f)=>a+tot[f.k][m],0);
  const nuevos=sum('k'),consultas=sum('c'),visitas=sum('v');
  const ocupadas=(base.clientesBase||0)+nuevos;
  const porFrente=FRENTES.map(f=>({k:f.k,n:f.n,s:f.s,base:base.origenBase[f.k]||0,c:tot[f.k].c,v:tot[f.k].v,k:tot[f.k].k,total:(base.origenBase[f.k]||0)+tot[f.k].k}));
  const ritmo=weeksWithData?nuevos/weeksWithData:null;
  const faltan=Math.max(0,(base.eqMin||0)-ocupadas);
  const semanasHasta=ritmo>0?faltan/ritmo:null;
  const fin=addDays(base.fechaBase||DEF_BASE.fechaBase,365);
  const semRest=Math.max(1,daysBetween(todayISO(),fin)/7);
  const ritmoNecesario=faltan/semRest;
  const today=todayISO();
  const acc=Object.values(S.acciones).sort((a,b)=>a.n-b.n);
  acc.forEach(a=>{a.vencida=a.estado!=='hecho'&&!!a.fecha&&a.fecha<today;a.dias=a.vencida?daysBetween(a.fecha,today):0;});
  const hechas=acc.filter(a=>a.estado==='hecho').length,enCurso=acc.filter(a=>a.estado==='en_curso').length,trabadas=acc.filter(a=>a.estado==='trabado').length,vencidas=acc.filter(a=>a.vencida).length;
  const cur=weeks.find(w=>w.lunes===mondayOf(today))||weeks[weeks.length-1];
  const curTot={c:0,v:0,k:0};if(cur)FRENTES.forEach(f=>['c','v','k'].forEach(m=>{const x=cellVal(cur.doc,f.k,m);if(x!=null)curTot[m]+=x;}));
  const vend=Object.values(S.vendedores).sort((a,b)=>a.codigo<b.codigo?-1:1);
  const vt={n:vend.length,guia:vend.filter(v=>v.guia).length,visito:vend.filter(v=>v.visito).length,contactos:vend.reduce((a,v)=>a+(+v.contactos||0),0),visitas:vend.reduce((a,v)=>a+(+v.visitas||0),0),contratos:vend.reduce((a,v)=>a+(+v.contratos||0),0),comision:vend.reduce((a,v)=>a+(+v.comision||0),0)};
  const acu=Object.values(S.acuerdos).sort((a,b)=>(a.orden||0)-(b.orden||0)||a.nombre.localeCompare(b.nombre));
  const etapaCount={};ETAPA_ORD.forEach(e=>etapaCount[e]=0);acu.forEach(a=>{etapaCount[a.etapa||'sin_contacto']=(etapaCount[a.etapa||'sin_contacto']||0)+1;});
  const prensa=Object.values(S.prensa).sort((a,b)=>(a.orden||0)-(b.orden||0));
  return {base,weeks,tot,porFrente,nuevos,consultas,visitas,ocupadas,ritmo,faltan,semanasHasta,ritmoNecesario,weeksWithData,acc,hechas,enCurso,trabadas,vencidas,cur,curTot,vend,vt,acu,etapaCount,prensa,today};
}

const dis=()=>readonly?' disabled':'';
function inp(col,id,f,t,val,cls,extra){
  const v=val==null?'':val;
  if(t==='bool') return `<input type="checkbox" id="${col}-${id}-${f.replace(/\./g,'_')}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="bool"${v?' checked':''}${dis()}>`;
  if(t==='num') return `<input class="in num ${cls||''}" type="number" min="0" step="1" inputmode="numeric" id="${col}-${id}-${f.replace(/\./g,'_')}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="num" value="${esc(v)}"${extra||''}${dis()}>`;
  if(t==='date') return `<input class="in date" type="date" id="${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="str" value="${esc(v)}"${dis()}>`;
  return `<input class="in ${cls||''}" type="text" id="${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="str" value="${esc(v)}"${extra||''}${dis()}>`;
}
function sel(col,id,f,opts,val){
  return `<select class="in" id="${col}-${id}-${f}" data-col="${col}" data-id="${id}" data-f="${f}" data-t="str"${dis()}>`+Object.keys(opts).map(k=>`<option value="${k}"${k===val?' selected':''}>${esc(opts[k])}</option>`).join('')+`</select>`;
}

function svgWeeks(c){
  const ws=c.weeks;const W=560,H=200,pl=28,pr=8,pt=12,pb=34;const iw=W-pl-pr,ih=H-pt-pb;
  const rows=ws.map(w=>{const t={c:0,v:0,k:0};FRENTES.forEach(f=>['c','v','k'].forEach(m=>{const x=cellVal(w.doc,f.k,m);if(x!=null)t[m]+=x;}));return Object.assign({w},t);});
  const max=Math.max(1,...rows.map(r=>Math.max(r.c,r.v,r.k)));
  const step=Math.max(1,Math.ceil(max/4));const top=step*4;
  const gw=iw/rows.length;const bw=Math.min(18,gw/4);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:100%;height:auto" role="img" aria-label="Consultas, visitas y contratos por semana">`;
  for(let i=0;i<=4;i++){const y=pt+ih-i/4*ih;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" font-size="10" text-anchor="end" style="fill:var(--muted)">${i*step}</text>`;}
  rows.forEach((r,i)=>{const x0=pl+i*gw+gw/2;const fills=[['c','var(--ink-4)'],['v','var(--ink-3)'],['k','var(--ink-1)']];
    fills.forEach(([m,col],j)=>{const h=r[m]/top*ih;const x=x0-bw*1.5+j*bw;s+=`<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${h.toFixed(1)}" style="fill:${col}"/>`;});
    s+=`<text x="${x0}" y="${H-pb+16}" font-size="10" text-anchor="middle" style="fill:var(--fg)">${ddmm(r.w.lunes)}</text>`;
    if(r.w.plan)s+=`<text x="${x0}" y="${H-pb+28}" font-size="9" text-anchor="middle" style="fill:var(--muted)">${esc(r.w.plan)}</text>`;
    if(!r.w.has)s+=`<text x="${x0}" y="${pt+ih-6}" font-size="9" text-anchor="middle" style="fill:var(--ink-3)">sin datos</text>`;});
  return s+'</svg>';
}

  const sel0=id&&a.selectionStart!=null?[a.selectionStart,a.selectionEnd]:null;

  if(id){const el=document.getElementById(id);if(el){if(el.type!=='checkbox'&&el.tagName!=='SELECT')el.value=val;el.focus({preventScroll:true});if(sel0&&el.setSelectionRange){try{el.setSelectionRange(sel0[0],sel0[1]);}catch(e){}}}}
}

/* ---------- writes ---------- */
const pendingPatch={},timers={},chain={};
function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++){o[p[i]]=o[p[i]]&&typeof o[p[i]]==='object'?o[p[i]]:{};o=o[p[i]];}o[p[p.length-1]]=val;}
function nested(path,val){const out={};setPath(out,path,val);return out;}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]&&typeof a[k]==='object'?a[k]:{},b[k]);}else a[k]=b[k];}return a;}
function localStore(col){return col==='config'?null:S[col];}
function defaultDoc(col,id){
  if(col==='semanas'){const v={};FRENTES.forEach(f=>v[f.k]={c:null,v:null,k:null});return {lunes:id,v,nota:''};}
  if(col==='config')return Object.assign({},DEF_BASE);
  return {};
}
function queueWrite(el,debounce){
  const col=el.dataset.col,id=el.dataset.id,f=el.dataset.f,t=el.dataset.t;
  let val;if(t==='bool')val=!!el.checked;else if(t==='num'){const x=Number(el.value);val=el.value===''||isNaN(x)?null:Math.max(0,x);}else val=el.value;
  const key=col+'/'+id;
  pendingPatch[key]=deepMerge(pendingPatch[key]||{},nested(f,val));
  if(col==='config'){S.base=deepMerge(S.base||Object.assign({},DEF_BASE),nested(f,val));}
  else{const st=S[col];if(st[id])deepMerge(st[id],nested(f,val));else st[id]=deepMerge(Object.assign({id},defaultDoc(col,id)),nested(f,val));}
  clearTimeout(timers[key]);
  if(debounce)timers[key]=setTimeout(()=>flush(key),650);else flush(key);
  if(!debounce)render();
}
function flush(key){
  const patch=pendingPatch[key];if(!patch||!db)return;delete pendingPatch[key];
  const [col,id]=key.split('/');
  const exists=col==='config'?!!(S.base&&S.base._exists):!!(S[col][id]&&S[col][id]._exists);
  setStatus('Guardando…');
  chain[key]=(chain[key]||Promise.resolve()).then(async()=>{
    const ref=db.doc(col+'/'+id);
    if(exists)await ref.update(patch);
    else{const snap=await ref.get();if(snap.exists)await ref.update(patch);else await ref.set(deepMerge(defaultDoc(col,id),patch));}
  }).then(()=>setStatus('Guardado'),e=>{console.error(e);if(e&&e.code==='invalid_argument'&&!exists){setStatus('No se pudo guardar.',true);}else if(e&&e.code==='invalid_argument'){setReadonly();}else setStatus('No se pudo guardar: '+(e&&e.message||'error'),true);});
}
async function createDoc(col,id,data){if(!db)return;setStatus('Guardando…');try{await db.doc(col+'/'+id).set(data);setStatus('Guardado');}catch(e){setStatus('No se pudo crear: '+(e&&e.message||'error'),true);}}
async function removeDoc(col,id){if(!db)return;setStatus('Quitando…');try{await db.doc(col+'/'+id).delete();setStatus('Guardado');}catch(e){setStatus('No se pudo quitar: '+(e&&e.message||'error'),true);}}
function setStatus(t,err){const s=$('#status');s.textContent=t;s.className='status'+(err?' err':'');}
function setReadonly(){readonly=true;setStatus('Solo lectura: tu acceso no permite editar.');render();}

/* ---------- events ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;showTab(b.dataset.tab);});
function showTab(t){document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.dataset.tab===t));try{localStorage.setItem('bkz-tab',t);}catch(e){}}
$('#main').addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.col||readonly)return;if(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date')return;queueWrite(el,true);});
$('#main').addEventListener('change',e=>{const el=e.target;if(!el.dataset||!el.dataset.col||readonly)return;if(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date')queueWrite(el,false);else if(timers[el.dataset.col+'/'+el.dataset.id]){clearTimeout(timers[el.dataset.col+'/'+el.dataset.id]);flush(el.dataset.col+'/'+el.dataset.id);}});
$('#main').addEventListener('click',e=>{
  const fb=e.target.closest('button[data-filter]');if(fb){planFilter=fb.dataset.filter;rPlan();return;}
  if(e.target.id==='add-vend'){const codes=Object.values(S.vendedores).map(v=>parseInt(String(v.codigo).replace(/\D/g,''),10)||0);const n=(Math.max(0,...codes)+1);const code='V'+String(n).padStart(2,'0');createDoc('vendedores',code,{codigo:code,nombre:'',telefono:'',guia:false,visito:false,contactos:0,visitas:0,contratos:0,comision:0,nota:''});return;}
  if(e.target.id==='add-acu'){const id='a'+Date.now().toString(36);const orden=Math.max(0,...Object.values(S.acuerdos).map(a=>a.orden||0))+1;createDoc('acuerdos',id,{nombre:'',grupo:'institucion',contacto:'',etapa:'sin_contacto',fecha:'',nota:'',orden});return;}
  const rm=e.target.closest('button[data-rm]');if(rm){if(rm.classList.contains('arm')){removeDoc(rm.dataset.rm,rm.dataset.id);}else{rm.classList.add('arm');rm.textContent='¿Quitar? Confirmar';setTimeout(()=>{if(rm.isConnected){rm.classList.remove('arm');rm.textContent='Quitar';}},3500);}return;}
});
$('#btn-pdf').addEventListener('click',exportPDF);

/* ---------- boot ---------- */
render();
try{const t=localStorage.getItem('bkz-tab');if(t&&R[t])showTab(t);}catch(e){}
(async()=>{
  if(!(window.claude&&window.claude.use)){setStatus('Vista sin datos: abrila desde claude.ai.',true);readonly=true;render();return;}
  const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]);
  db=d;downloads=dl;
  if(dl)$('#btn-pdf').hidden=false;
  if(!db){setStatus('Sin acceso a los datos. Iniciá sesión en claude.ai para ver y cargar el tablero.',true);readonly=true;render();return;}
  try{canWrite=u?await u.can('data.write'):null;}catch(e){canWrite=null;}
  if(canWrite===false){readonly=true;}
  setStatus(readonly?'Solo lectura':'Conectado');
  const onErr=e=>{console.error(e);setStatus('Problema con los datos: '+(e&&e.message||e.code),true);};
  db.doc('config/base').onSnapshot(s=>{S.base=s.exists?Object.assign({_exists:true},s.data()):null;render('resumen');},onErr);
  const sub=(col,fn)=>db.collection(col).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign({id:d.id,_exists:true},d.data());});S[col]=m;fn();},onErr);
  sub('semanas',()=>render());
  sub('acciones',()=>{render('resumen');render('plan');});
  sub('vendedores',()=>render('vendedores'));
  sub('acuerdos',()=>render('acuerdos'));
  sub('prensa',()=>render('acuerdos'));
})();

/* ---------- PDF ---------- */
async function exportPDF(){
  if(!downloads)return;
  if(!(window.jspdf&&window.jspdf.jsPDF)){setStatus('No se pudo cargar el generador de PDF.',true);return;}
  const btn=$('#btn-pdf');btn.disabled=true;setStatus('Armando el PDF…');
  try{
    const c=compute();const b=c.base;
    const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'pt',format:'a4'});
    const W=595.28,H=841.89,M=46;const fecha=ddmmyyyy(c.today);
    const NEG=[5,9,10],GR=[89,89,89],BOX=[239,239,239],BORDE=[191,191,191];
    let y=M;
    try{d.addImage(LOGO_DARK,'PNG',M,y,73,22);}catch(e){}
    d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(...GR);
    d.text('Grupo Libertador Bahía S.A. — CUIT 30-71875958-3',M,y+32);d.text('San Martín 133, Bahía Blanca, Buenos Aires',M,y+41);
    d.setTextColor(...NEG);d.setFont('helvetica','bold');d.setFontSize(13);d.text('INFORME DE AVANCE COMERCIAL',W-M,y+10,{align:'right'});
    d.setFontSize(8.5);d.text('SEGUIMIENTO DEL PLAN DE VENTA',W-M,y+22,{align:'right'});
    d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(...GR);d.text('Sucursal Casa Central',W-M,y+32,{align:'right'});
    y+=60;d.setFont('helvetica','italic');d.setFontSize(7.4);d.setTextColor(...NEG);
    {const li=d.splitTextToSize(`Generado el ${fecha} desde el tablero de seguimiento. Punto de partida: ${b.clientesBase} contratos al ${ddmmyyyy(b.fechaBase)}. ${b.eqNota||''}`,W-2*M);d.text(li,M,y);y+=li.length*9.5+8;}
    const bar=t=>{if(y>H-110){d.addPage();y=M;}d.setFillColor(...NEG);d.rect(M,y,W-2*M,15,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(8.5);d.text(t.toUpperCase(),M+6,y+10.6);y+=21;};
    const para=t=>{y+=6;d.setFont('helvetica','normal');d.setFontSize(8.2);d.setTextColor(...NEG);const lines=d.splitTextToSize(t,W-2*M);d.text(lines,M,y);y+=lines.length*10.5+4;};
    const table=(head,body,opts)=>{d.autoTable(Object.assign({startY:y,margin:{left:M,right:M,top:M,bottom:44},head:[head],body,theme:'grid',styles:{font:'helvetica',fontSize:7.6,cellPadding:{top:3,bottom:3.5,left:5,right:5},lineColor:BORDE,lineWidth:0.4,textColor:NEG,overflow:'linebreak',valign:'top'},headStyles:{fillColor:NEG,textColor:255,fontStyle:'bold',fontSize:7.2},alternateRowStyles:{fillColor:255}},opts||{}));y=d.lastAutoTable.finalY+10;};
    const n=v=>({content:String(v),styles:{halign:'right'}});
    bar('Dónde estamos');
    table(['Cajas ocupadas','Punto de equilibrio','Contratos nuevos desde el '+ddmm(b.fechaBase),'Ritmo (contratos / semana)','Ritmo necesario','Plan de acción'],[[
      {content:`${c.ocupadas} de ${b.cajas} (${(c.ocupadas/b.cajas*100).toLocaleString('es-AR',{maximumFractionDigits:1})}%)`,styles:{fontStyle:'bold'}},
      `${c.ocupadas} de ${b.eqMin}${b.eqMax&&b.eqMax!==b.eqMin?'–'+b.eqMax:''} cajas`,
      `${c.nuevos} (${c.consultas} consultas, ${c.visitas} visitas)`,
      c.ritmo==null?'Sin datos':c.ritmo.toLocaleString('es-AR',{maximumFractionDigits:1})+(c.semanasHasta!=null?` · faltan ${Math.ceil(c.semanasHasta)} semanas para el equilibrio`:''),
      c.ritmoNecesario.toLocaleString('es-AR',{maximumFractionDigits:1})+' para llegar en un año',
      `${c.hechas} de ${c.acc.length} hechas · ${c.vencidas} vencidas · ${c.enCurso} en curso · ${c.trabadas} trabadas`]]);
    bar('Tablero por frente');
    table(['Frente','Al '+ddmm(b.fechaBase),'Consultas','Visitas','Contratos nuevos','Total contratos','Visita / consulta','Contrato / visita'],
      c.porFrente.map(f=>[f.n,n(f.base),n(f.c),n(f.v),n(f.k),{content:String(f.total),styles:{halign:'right',fontStyle:'bold'}},n(pct(f.v,f.c)),n(pct(f.k,f.v))]).concat([[{content:'Total',styles:{fontStyle:'bold'}},{content:String(b.clientesBase),styles:{halign:'right',fontStyle:'bold'}},{content:String(c.consultas),styles:{halign:'right',fontStyle:'bold'}},{content:String(c.visitas),styles:{halign:'right',fontStyle:'bold'}},{content:String(c.nuevos),styles:{halign:'right',fontStyle:'bold'}},{content:String(c.ocupadas),styles:{halign:'right',fontStyle:'bold'}},n(pct(c.visitas,c.consultas)),n(pct(c.nuevos,c.visitas))]]),{columnStyles:{0:{cellWidth:150}}});
    table(['Semana','Consultas','Visitas','Contratos','Nota'],c.weeks.map(w=>{const t={c:0,v:0,k:0};FRENTES.forEach(f=>['c','v','k'].forEach(m=>{const x=cellVal(w.doc,f.k,m);if(x!=null)t[m]+=x;}));return [`${w.label} (${ddmm(w.lunes)} al ${ddmm(addDays(w.lunes,6))})${w.plan?' · '+w.plan:''}`,n(w.has?t.c:'—'),n(w.has?t.v:'—'),n(w.has?t.k:'—'),(w.doc&&w.doc.nota)||''];}),{columnStyles:{0:{cellWidth:190}}});
    bar('Embudo de venta');
    table(['Etapa','Cantidad','Conversión'],[['Consultas',n(c.consultas),'—'],['Visitas a la bóveda',n(c.visitas),n(pct(c.visitas,c.consultas)+' de las consultas')],['Contratos',n(c.nuevos),n(pct(c.nuevos,c.visitas)+' de las visitas')]],{columnStyles:{0:{cellWidth:200}}});
    bar('Plan de acción');
    para(`${c.hechas} de ${c.acc.length} acciones hechas. ${c.vencidas} vencidas, ${c.enCurso} en curso, ${c.trabadas} trabadas. Las vencidas se marcan en la columna Estado.`);
    const body=[];let lastG='';
    c.acc.forEach(a=>{if(a.semana!==lastG){body.push([{content:a.semana,colSpan:6,styles:{fillColor:BOX,fontStyle:'bold'}}]);lastG=a.semana;}
      body.push([n(a.n),a.hasta||ddmm(a.fecha)||'—',a.frente,a.accion+(a.nota?'\nNota: '+a.nota:''),{content:(EST_ACC[a.estado]||'Pendiente')+(a.vencida?` · VENCIDA (${a.dias} d)`:'')+(a.estado==='hecho'&&a.fechaHecho?' · '+ddmm(a.fechaHecho):''),styles:{fontStyle:a.vencida||a.estado==='hecho'?'bold':'normal'}},a.resp||'']);});
    table(['N°','Fecha','Frente','Acción','Estado','Responsable'],body,{columnStyles:{0:{cellWidth:24},1:{cellWidth:44},2:{cellWidth:70},3:{cellWidth:'auto'},4:{cellWidth:92},5:{cellWidth:66}},styles:{font:'helvetica',fontSize:7.2,cellPadding:{top:2.2,bottom:2.6,left:4,right:4},lineColor:BORDE,lineWidth:0.4,textColor:NEG,overflow:'linebreak'}});
    bar('Fuerza de venta — vendedores');
    para(`${c.vt.n} vendedores. ${c.vt.guia} con guía entregada, ${c.vt.visito} conocieron la bóveda. ${c.vt.contactos} contactos pasados, ${c.vt.visitas} visitas, ${c.vt.contratos} contratos. Comisiones pagadas: ${money(c.vt.comision)}.`);
    table(['Código','Vendedor','Guía','Bóveda','Contactos','Visitas','Contratos','Comisión pagada','Nota'],c.vend.map(v=>[v.codigo,v.nombre||'',v.guia?'Sí':'No',v.visito?'Sí':'No',n(+v.contactos||0),n(+v.visitas||0),n(+v.contratos||0),n(money(v.comision)),v.nota||'']),{columnStyles:{1:{cellWidth:120}}});
    bar('Acuerdos comerciales');
    para(ETAPA_ORD.map(e=>`${ETAPAS[e]}: ${c.etapaCount[e]||0}`).join(' · '));
    table(['Institución o empresa','Grupo','Contacto','Etapa','Último paso','Nota'],c.acu.map(a=>[a.nombre||'',GRUPOS[a.grupo]||'',a.contacto||'',ETAPAS[a.etapa]||'',ddmm(a.fecha),a.nota||'']),{columnStyles:{0:{cellWidth:140},3:{cellWidth:95}}});
    bar('Prensa');
    table(['Medio','Estado','Fecha','Nota'],c.prensa.map(p=>[p.medio,EST_PRENSA[p.estado]||'',ddmm(p.fecha),p.nota||'']),{columnStyles:{0:{cellWidth:130},1:{cellWidth:90}}});
    const pages=d.getNumberOfPages();
    for(let i=1;i<=pages;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(...GR);d.text(`BANKZ — Documento interno y confidencial — ${fecha} — Informe de avance comercial`,M,24);d.text(`Página ${i} de ${pages}`,W-M,24,{align:'right'});}
    const blob=d.output('blob');
    await downloads.save({filename:`Bankz_Informe_de_Avance_${c.today}.pdf`,data:blob});
    setStatus('PDF exportado');
  }catch(e){console.error(e);setStatus(e&&e.code==='declined'?'Exportación cancelada':'No se pudo exportar: '+(e&&e.message||'error'),e&&e.code!=='declined');}
  btn.disabled=false;
}
})();
</script>
